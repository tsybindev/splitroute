[workspace]
resolver = "2"
members = ["src-tauri", "crates/protocol", "crates/helper"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
