[package]
name = "splitroute"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "splitroute_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Разбор тела подписки в формате Clash YAML. serde_yaml 0.9 — зрелый
# минимальный serde-парсер; крейт в archive-статусе, но API заморожен и
# стабилен, а форки (serde_yml) менее проверены.
serde_yaml = { workspace = true }
thiserror = { workspace = true }
splitroute-protocol = { path = "../crates/protocol" }
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "http2",
    "charset",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
dirs = "7"
uuid = { version = "1", features = ["v4"] }
# Иконки каталога: декодирование PNG и resize. Крейт уже в дереве через
# tauri/image-png, поэтому новых зависимостей по факту нет.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# QR-импорт подписки: декодирование QR-кодов со скриншота или файла.
# rqrr — pure Rust; его опциональная зависимость image допускает 0.25, поэтому
# версии не дублируются (крейт уже в дереве через tauri/image-png).
rqrr = "0.11"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
# Генератор QR для тестов декодера. Без фичи `image`: пиксели собираются
# вручную через `to_colors()`, а PNG кодирует крейт `image` из обычных
# зависимостей — версии image не пересекаются, граница только PNG-байты.
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
