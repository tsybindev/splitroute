name: release

# Релизный конвейер (S9-T1): тег v* → подписанные updater-артефакты →
# черновик GitHub Release с манифестом latest.json → публикация.
# В отличие от build.yml сборка идёт с ключом подписи из GitHub Secrets
# (без SPLITROUTE_ALLOW_UNSIGNED), поэтому NSIS/AppImage получают .sig.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег релиза (например v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Зависимости Tauri 2 и сборки AppImage (AGENTS.md §5.1).
      - name: "Linux: системные зависимости"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file

      # fetch-core.sh и fetch-wintun.sh распаковывают zip через unzip.
      - name: "Windows: unzip для архивов ядра и wintun"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command unzip -ErrorAction SilentlyContinue)) {
            choco install unzip --no-progress -y
            "$env:ProgramData\chocolatey\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Зависимости фронтенда
        run: pnpm install --frozen-lockfile

      - name: sing-box закреплённой версии
        shell: bash
        run: ./scripts/fetch-core.sh

      - name: wintun.dll
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/fetch-wintun.sh

      # externalBin ищется tauri-build уже на сборке, поэтому sidecar'ы нужны до пакета.
      - name: sidecar helper'а
        shell: bash
        run: ./scripts/build-helper-sidecar.sh

      # Тесты здесь не повторяются: их прогоняет build.yml на main,
      # тег режется с протестированной main. Пакет подписывается ключом из
      # Secrets: без него updater-артефакты не создать, сборка упадёт.
      - name: Пакет с updater-подписью
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: splitroute-${{ matrix.name }}-release
          # .sig нужны для latest.json; deb/rpm апдейтер не использует,
          # но выкладываются в релиз как обычные пакеты.
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  release:
    name: публикация релиза
    needs: [package]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: splitroute-*-release
          path: artifacts
          merge-multiple: true

      - name: Версия и канал из тега
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "Тег $TAG: ожидается формат v*" >&2; exit 1 ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          case "$TAG" in
            *-beta*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      # make-latest-json.sh ищет артефакты версии в target/release/bundle:
      # раскладываем скачанные файлы по ожидаемой структуре.
      - name: Разбор артефактов по структуре bundle
        shell: bash
        run: |
          mkdir -p target/release/bundle/nsis target/release/bundle/appimage \
            target/release/bundle/deb target/release/bundle/rpm
          find artifacts -name '*-setup.exe*' -exec cp {} target/release/bundle/nsis/ \;
          find artifacts -name '*.AppImage*' -exec cp {} target/release/bundle/appimage/ \;
          find artifacts -name '*.deb' -exec cp {} target/release/bundle/deb/ \;
          find artifacts -name '*.rpm' -exec cp {} target/release/bundle/rpm/ \;

      # Стабильный релиз обслуживает оба канала: beta-latest.json ведёт на
      # этот же релиз, пока нет отдельной beta-сборки.
      - name: Манифест stable (latest.json и beta-latest.json)
        if: env.PRERELEASE == 'false'
        shell: bash
        run: |
          ./scripts/make-latest-json.sh \
            --version "$VERSION" --tag "$TAG" --repo "${{ github.repository }}" \
            --notes "SplitRoute $VERSION" \
            --require-platform windows-x86_64,linux-x86_64 --out latest.json
          cp latest.json beta-latest.json

      # Beta-тег: манифест только для beta-канала; latest.json стабильных
      # пользователей не трогаем.
      - name: Манифест beta (beta-latest.json)
        if: env.PRERELEASE == 'true'
        shell: bash
        run: ./scripts/make-latest-json.sh \
          --version "$VERSION" --tag "$TAG" --repo "${{ github.repository }}" \
          --notes "SplitRoute $VERSION beta" \
          --require-platform windows-x86_64,linux-x86_64 --out beta-latest.json

      - name: Черновик релиза
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Релиз $TAG уже существует — артефакты будут дозагружены (--clobber)"
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --prerelease --generate-notes --title "SplitRoute $VERSION"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --generate-notes --title "SplitRoute $VERSION"
          fi

      - name: Загрузка артефактов и манифеста
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-setup.exe.sig \
            target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.sig \
            target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm beta-latest.json"
          if [ "$PRERELEASE" = "false" ]; then
            FILES="$FILES latest.json"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $FILES

      # releases/latest/download/<file> обслуживает только опубликованные
      # (не draft) релизы — публикация строго после успешной загрузки.
      - name: Публикация (снятие черновика)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

      # releases/latest/download не раздаёт prereleases, поэтому beta-манифест
      # нужно положить и на последний стабильный релиз, откуда его читает
      # beta-канал приложения.
      - name: Beta-манифест в последний стабильный релиз
        if: env.PRERELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STABLE=$(gh release list --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts --exclude-prereleases --limit 1 --json tagName -q '.[0].tagName' || true)
          if [ -n "$STABLE" ]; then
            gh release upload "$STABLE" --repo "$GITHUB_REPOSITORY" --clobber beta-latest.json
          else
            echo "Стабильных релизов ещё нет: beta-манифест останется на prerelease" >&2
          fi
